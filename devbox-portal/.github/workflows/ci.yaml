name: DevBox CI

on: [push, pull_request]

jobs:
  devbox-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install DevBox
        run: |
          curl -fsSL https://get.jetpack.io/devbox/install.sh | bash
          echo "$HOME/.devbox/bin" >> $GITHUB_PATH

      - name: Run Backstage install
        run: |
          devbox run echo "Testing Backstage setup"
